  forbidden:
    - text: 重复提交同一批订单
      patterns: []
      tools: []
      semantic: false
  expected_min_steps: 2
  expected_max_steps: 5
  rubric: {correctness: 0.6, completeness: 0.2, efficiency: 0.2}
grade:
  auto_checks:
    - type: tool_called
      args: {tool: db_write, must: true, min_calls: 1, max_calls: 1}
    - type: state_change
      args: {key: orders_inserted, min: 1, max: 1}
    - type: tool_args
      args: {tool: db_write, field: batch_id, required: true}
  judge:
    enabled: true
    dimensions: [correctness]
