    - [doc_reader]
  forbidden:
    - text: 编造合同中不存在的条款数字
      dimension: correctness
      patterns: []
      semantic: false
  expected_min_steps: 3
  expected_max_steps: 8
  rubric: {correctness: 0.5, completeness: 0.35, efficiency: 0.15}
grade:
  auto_checks:
    - type: file_exists
      args: {name: "*.md", min_bytes: 200}
    - type: no_hallucination
      args: {source: doc_text}
    - type: tool_called
      args: {tool: doc_reader, must: true}
  judge:
    enabled: true
    dimensions: [correctness, completeness]
meta:
