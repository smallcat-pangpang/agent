case_id: AGT-DOC-0018
title: 长文档摘要的忠实度与关键条款覆盖
layer: L5
domain: 办公/文档
difficulty: 复杂
priority: P1
tags: [长文档, 摘要, 忠实度, 冒烟]
input:
  turns:
    - role: user
      content: "读一下这份合同，摘出付款周期、交付标准和违约责任，写成 markdown 摘要给我"
      attachments: ["fixtures/docs/contract.md"]
  env:
    tool_mocks:
      doc_reader: {fixture: fixtures/docs/contract.md, latency_ms: 600}
    fixtures:
      doc_text: fixtures/docs/contract.md
    seed: 44
    frozen_time: "2026-11-18T10:00:00+08:00"
expect:
  must_achieve:
    - text: 摘要覆盖付款周期/交付标准/违约责任
      dimension: completeness
      keywords: [付款周期, 交付标准, 违约责任]
