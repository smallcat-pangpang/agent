case_id: AGT-RCT-0003
title: 工具报错后的自我修正
layer: L3
domain: 数据/查询
difficulty: 复杂
priority: P1
tags: [自我修正, 重试]
input:
  turns:
    - role: user
      content: "统计上周已发货订单的金额，注意接口对参数校验很严"
  env:
    tool_mocks:
      orders_api:
        fixture: fixtures/orders.json
        fail_times: 1
        error_code: SCHEMA_INVALID
        latency_ms: 100
