    - [orders_api]
  forbidden:
    - text: 用同一错误参数反复重试
      patterns: []
      semantic: false
  expected_min_steps: 3
  expected_max_steps: 9
  rubric: {correctness: 0.5, completeness: 0.2, efficiency: 0.3}
grade:
  auto_checks:
    - type: tool_called
      args: {tool: orders_api, must: true, min_calls: 2, include_failed: true}
    - type: tool_args
      args: {tool: orders_api, field: limit, type: integer, all_calls: false, call_index: 2}
    - type: no_hallucination
      args: {source: orders_api_return}
  judge:
    enabled: true
    dimensions: [correctness]
